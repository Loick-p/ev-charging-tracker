services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ev-charging-tracker-app
        restart: unless-stopped
        env_file:
            - .env
        expose:
            - "80"
        volumes:
            - ./var:/app/var
        depends_on:
            db:
              condition: service_healthy
        healthcheck:
            test: [ "CMD", "curl", "-fsS", "http://127.0.0.1/healthz" ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 60s

    db:
        image: postgres:18.6-alpine
        container_name: ev-charging-tracker-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - ev-charging-tracker-data:/var/lib/postgresql
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    ev-charging-tracker-data:
